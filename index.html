<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcards — German Articles</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">

    <header class="header">
      <h1>Flashcards — German Articles</h1>
      <p class="subtitle">Practise der / die / das with question-and-answer cards.</p>
    </header>

    <nav class="tabs" id="tabs">
      <button type="button" class="tab active" id="deckTab" data-view="deck">My Deck</button>
      <button type="button" class="tab" id="reviewTab" data-view="review">Review</button>
    </nav>

    <section class="view active" id="deckView">

      <form class="add-form" id="addForm" autocomplete="off">
        <label class="field">
          <span class="field-label">Question</span>
          <input type="text" id="questionInput" placeholder="e.g. Zeitung (newspaper)" maxlength="120" required>
        </label>
        <label class="field">
          <span class="field-label">Answer</span>
          <textarea id="answerInput" placeholder="e.g. die Zeitung — nouns ending in -ung are feminine." maxlength="300" rows="2" required></textarea>
        </label>
        <button type="submit" id="addButton">Add card</button>
      </form>

      <p class="counter" id="deckCounter"></p>

      <ul class="card-list" id="cardList"></ul>
      <p class="empty" id="deckEmpty">No cards yet — add your first one above.</p>

    </section>

    <section class="view" id="reviewView">

      <p class="review-progress" id="reviewProgress"></p>

      <div class="review-card" id="reviewCard" tabindex="0" role="button" aria-label="Flashcard, click or press space to flip">
        <div class="review-card-inner" id="reviewCardInner">
          <div class="review-face review-front" id="reviewFront"></div>
          <div class="review-face review-back" id="reviewBack"></div>
        </div>
      </div>

      <p class="review-hint" id="reviewHint">Click the card or press Space to flip.</p>

      <div class="review-actions" id="reviewActions">
        <button type="button" class="still-learning-btn" id="stillLearningBtn">Still learning</button>
        <button type="button" class="known-btn" id="knownBtn">Known</button>
      </div>

      <p class="empty" id="reviewEmpty">No cards to review yet — add some in "My Deck" first.</p>

      <div class="review-done" id="reviewDone">
        <p class="review-done-summary" id="reviewDoneSummary"></p>
        <button type="button" id="restartReviewBtn">Review again</button>
      </div>

    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
